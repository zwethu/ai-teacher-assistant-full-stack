[project]
name = "ai-teacher-assistant-backend"
version = "0.1.0"
description = "Thin FastAPI layer — Firebase & Agent Engine live in the React app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "firebase-admin",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "apscheduler",
    "httpx",
    "pydantic",
    "google-cloud-storage",
    "google-cloud-discoveryengine",
    "google-cloud-aiplatform[adk,agent-engines]",
    "python-multipart",
    "pypdf",
    "python-docx",
    "python-pptx",
    "pillow",
    "pillow-heif",
    "google-genai",
    "google-cloud-documentai",
    "google-cloud-tasks",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routers", "services", "utils", "entity"]
