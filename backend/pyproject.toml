[project]
name = "ai-teacher-assistant-backend"
version = "0.1.0"
description = "Thin FastAPI layer — Firebase & Agent Engine live in the React app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "firebase-admin",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "apscheduler",
    "httpx",
    "pydantic",
    "google-cloud-storage",
    "google-cloud-discoveryengine",
    "google-cloud-aiplatform[adk,agent-engines]",
    "python-multipart",
    "pypdf",
    "python-docx",
    # chat/response export: Markdown -> HTML -> PDF. Pure Python on purpose —
    # the API image is python:3.12-slim with no apt layer, so WeasyPrint's
    # cairo/pango system libraries are not available.
    "markdown",
    "xhtml2pdf",
    "python-pptx",
    # first-page PDF thumbnails; manylinux wheels, so no apt layer needed
    "pypdfium2",
    "pillow",
    "pillow-heif",
    "google-genai",
    "google-cloud-documentai",
    "google-cloud-tasks",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routers", "services", "utils", "entity"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
