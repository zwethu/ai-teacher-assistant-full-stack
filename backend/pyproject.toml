[project]
name = "ai-teacher-assistant-backend"
version = "0.1.0"
description = "Thin FastAPI layer — Firebase & Agent Engine live in the React app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "firebase-admin",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "apscheduler",
    "python-dotenv",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routers", "services", "utils"]
